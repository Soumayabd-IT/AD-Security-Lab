<svg width="680" height="450" viewBox="0 0 680 450" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flux d'authentification Kerberos</title>
<desc>Diagramme montrant les six échanges entre le client, le KDC (AS et TGS) et le service, avec les noms de messages AS-REQ, AS-REP, TGS-REQ, TGS-REP, AP-REQ et AP-REP.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#575751" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="40" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="110" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client</text>

<rect x="250" y="40" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="350" y="55" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">KDC</text>
<text x="350" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">AS + TGS, clé krbtgt</text>

<rect x="500" y="40" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="565" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Service</text>

<line x1="180" y1="130" x2="248" y2="130" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="214" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">1. AS-REQ</text>

<line x1="248" y1="185" x2="180" y2="185" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="214" y="177" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">2. AS-REP (TGT)</text>

<line x1="180" y1="240" x2="248" y2="240" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="214" y="232" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">3. TGS-REQ (+SPN)</text>

<line x1="248" y1="295" x2="180" y2="295" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="214" y="287" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">4. TGS-REP (ticket)</text>

<line x1="180" y1="350" x2="498" y2="350" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="340" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">5. AP-REQ vers le service</text>

<line x1="498" y1="405" x2="180" y2="405" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5"/>
<text x="340" y="397" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#52514E">6. AP-REP (optionnel, mutual auth)</text>
</svg>
